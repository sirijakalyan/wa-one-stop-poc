AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  WA Business One-Stop-Shop: a Cognito user pool for sign in, a Secrets Manager secret for the server's settings,
  and a policy that lets the Elastic Beanstalk server use both. No passwords or keys are in this file.

Parameters:
  AppName:
    Type: String
    Default: wa-onestop
  SenderEmail:
    Type: String
    Default: hr@knackhook.com
    Description: Shown as the sender of SendGrid emails (must be verified in SendGrid).

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    Properties:
      UserPoolName: !Sub '${AppName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # People choose their own password when they sign up or reset it, so every password is permanent. Nobody is
      # ever created with a temporary password.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 1
      Schema:
        - { Name: email, Required: true, Mutable: true }
        - { Name: name, Required: true, Mutable: true }
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      UserPoolAddOns:
        AdvancedSecurityMode: 'OFF'
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT   # 50 emails a day. Switch to SES (DEVELOPER) before real use.
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your WA Business One-Stop-Shop code
        EmailMessage: 'Your code is {####}. It works for one hour. If you did not ask for it, ignore this email.'

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AppName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool
      Description: Can open Admin, see users and edit rules and links.

  # The server's settings. ADMIN_KEY is generated here. Add DATABASE_URL and SENDGRID_API_KEY yourself in the
  # Secrets Manager console (Retrieve secret value, then Edit). They are never in this template.
  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    Properties:
      Name: !Sub '${AppName}/app'
      Description: Settings for the WA Business One-Stop-Shop server.
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"SENDGRID_FROM_EMAIL":"${SenderEmail}","SENDGRID_FROM_NAME":"WA Business One-Stop-Shop","COGNITO_USER_POOL_ID":"${UserPool}","COGNITO_CLIENT_ID":"${UserPoolClient}","AWS_REGION":"${AWS::Region}"}'
        GenerateStringKey: ADMIN_KEY
        PasswordLength: 40
        ExcludePunctuation: true

  ServerAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AppName}-server-access'
      Description: Lets the Elastic Beanstalk instances read the app secret and manage users in the user pool. Attach it to the aws-elasticbeanstalk-ec2-role.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadAppSecret
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref AppSecret
          - Sid: ManageUsers
            Effect: Allow
            Action:
              - cognito-idp:ListUsers
              - cognito-idp:AdminListGroupsForUser
              - cognito-idp:AdminAddUserToGroup
              - cognito-idp:AdminRemoveUserFromGroup
            Resource: !GetAtt UserPool.Arn

Outputs:
  UserPoolId: { Value: !Ref UserPool }
  UserPoolClientId: { Value: !Ref UserPoolClient }
  SecretName: { Value: !Sub '${AppName}/app' }
  SecretArn: { Value: !Ref AppSecret }
  ServerPolicyArn: { Value: !Ref ServerAccessPolicy }
